# Home Assistant add-on manifest. The Supervisor renders the "Configuration"
# tab from `schema:` below -- but the entity lists and most options are edited
# in the add-on's own Ingress UI (with entity pickers), so the native schema
# here stays intentionally small.
name: HA Wrapped
version: "1.0.1"
slug: ha_wrapped
description: A Spotify-Wrapped-style year (or month) review for your Home Assistant.
url: https://github.com/3DJupp/ha-wrapped/tree/main/ha_wrapped
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
init: false

# Serve the UI straight into the Home Assistant frontend (sidebar). HA handles
# authentication, so no port needs to be exposed and no token is required.
ingress: true
ingress_port: 8099
panel_icon: mdi:chart-box
panel_title: Wrapped

# Reach Home Assistant Core through the Supervisor proxy (statistics over the
# WebSocket API, history + states over REST) using the add-on's own token --
# the user never has to create a long-lived access token.
homeassistant_api: true

# The rendered HTML + PNG are written to /data (persistent, served via Ingress)
# and copied to /share/ha-wrapped/ so they are reachable over Samba/SSH too.
map:
  - share:rw

options:
  log_level: info
schema:
  log_level: list(trace|debug|info|notice|warning|error|fatal)?
