---
# Architecture-specific base images for the HA Supervisor build system.
# These are the official HA Python base images — minimal Alpine + Python 3.12.
build_from:
  aarch64: ghcr.io/home-assistant/aarch64-base-python:3.12-alpine3.20
  amd64: ghcr.io/home-assistant/amd64-base-python:3.12-alpine3.20
  armhf: ghcr.io/home-assistant/armhf-base-python:3.12-alpine3.20
  armv7: ghcr.io/home-assistant/armv7-base-python:3.12-alpine3.20
  i386: ghcr.io/home-assistant/i386-base-python:3.12-alpine3.20

squash: false

labels:
  org.opencontainers.image.title: "HA Wrapped"
  org.opencontainers.image.description: "Spotify-Wrapped-style review for Home Assistant"
  org.opencontainers.image.source: "https://github.com/3DJupp/ha-wrapped"
  org.opencontainers.image.licenses: "MIT"
