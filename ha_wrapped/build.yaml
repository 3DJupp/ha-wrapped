# Base images per architecture. Bump the alpine/python tag here if a build
# ever fails because a tag was retired.
build_from:
  aarch64: ghcr.io/home-assistant/aarch64-base-python:3.12-alpine3.19
  amd64: ghcr.io/home-assistant/amd64-base-python:3.12-alpine3.19
  armhf: ghcr.io/home-assistant/armhf-base-python:3.12-alpine3.19
  armv7: ghcr.io/home-assistant/armv7-base-python:3.12-alpine3.19
  i386: ghcr.io/home-assistant/i386-base-python:3.12-alpine3.19
# HA_WRAPPED_REF pins which git ref of the engine (wrapped.py + template.html)
# gets installed. Defaults to main; override per build if needed.
# ENGINE_CACHE_BUST must match the config.yaml version on every release -- it
# forces Docker to re-pull the engine from the (moving) ref above instead of
# serving a stale cached layer. Bump it together with config.yaml `version:`.
args:
  HA_WRAPPED_REF: main
  ENGINE_CACHE_BUST: "1.0.9"
